version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Привет
      - Здравствуйте
      - Добрый день
      - Хай
      - Приветствую
      - Как дела?
      - Как поживаете?
      - Здарова
      - Добрый вечер
      - Приветик

  - intent: goodbye
    examples: |
      - Пока
      - До свидания
      - Увидимся
      - Всего доброго
      - Всего хорошего
      - На этом всё, спасибо!
      - Пока-пока
      - Прощайте
      - Спокойной ночи
      - До встречи

  - intent: ask_architecture
    examples: |
      - Расскажите об архитектуре ПО
      - Что такое архитектура программного обеспечения?
      - Какие есть виды архитектур?
      - Объясните микросервисную архитектуру
      - Как выбрать архитектуру для проекта?
      - Чем отличается монолит от микросервисов?
      - Как архитектура влияет на масштабируемость?
      - Какие есть современные подходы к проектированию ПО?
      - Какие инструменты помогают в проектировании архитектуры?
      - Объясните, что значит чистая архитектура

  - intent: affirm
    examples: |
      - Да
      - Верно
      - Именно
      - Точно
      - Конечно
      - Всё правильно
      - Абсолютно
      - Я согласен
      - Так и есть
      - Совершенно верно

  - intent: deny
    examples: |
      - Нет
      - Не нужно
      - Неверно
      - Это не так
      - Я не согласен
      - Не хочу
      - Отказаться
      - Не сейчас
      - Это не подходит
      - Совсем нет

  - intent: request_info
    examples: |
      - Расскажите больше об этом
      - Можете уточнить?
      - А можно поподробнее?
      - Что вы имеете в виду?
      - Какие есть детали?
      - Объясните это подробнее
      - Я не совсем понял, уточните, пожалуйста
      - Есть дополнительные сведения?
      - Что еще нужно знать?
      - А какие есть примеры?
